<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="t d">
<title id="t">How i-Share works</title>
<desc id="d">Six steps: post a co-request or start a real-time match, partners join, group chat, in-person QR check-in, rate each other, the credibility score updates.</desc>
<rect width="1200" height="290" rx="16" fill="#14161a"/>
<defs>
    <marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8" fill="none" stroke="#5b8cff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8" fill="none" stroke="#e8e6df" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
<text x="40" y="44" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#5b8cff" text-anchor="start" letter-spacing="1.8">HOW IT WORKS</text><rect x="90" y="84" width="60" height="60" rx="14" fill="#1f2227" stroke="#3a3f47" stroke-width="1"/><g transform="translate(120 114)"><rect x="-11" y="-14" width="22" height="28" rx="4" fill="none" stroke="#5b8cff" stroke-width="1.7"/><path d="M0 -6 V6 M-6 0 H6" fill="none" stroke="#5b8cff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><text letter-spacing="1.5" x="120" y="76" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#5b8cff" text-anchor="middle">01</text><text x="120" y="178" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="650" fill="#e8e6df" text-anchor="middle">Post a request</text><text x="120" y="202" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">A co-request with price,</text><text x="120" y="221" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">place and expiry, or a</text><text x="120" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">real-time match.</text><path d="M164 114 H268" fill="none" stroke="#5b8cff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hb)"/><rect x="282" y="84" width="60" height="60" rx="14" fill="#1f2227" stroke="#3a3f47" stroke-width="1"/><g transform="translate(312 114)"><circle cx="-6" cy="-6" r="4.5" fill="none" stroke="#5b8cff" stroke-width="1.7"/><path d="M-14 12 a8 7 0 0 1 16 0" fill="none" stroke="#5b8cff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><circle cx="8" cy="-4" r="3.6" fill="none" stroke="#5b8cff" stroke-width="1.7"/><path d="M4 10 a7 6 0 0 1 12 -1" fill="none" stroke="#5b8cff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M9 14 l3 3 l6 -6" fill="none" stroke="#5b8cff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><text letter-spacing="1.5" x="312" y="76" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#5b8cff" text-anchor="middle">02</text><text x="312" y="178" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="650" fill="#e8e6df" text-anchor="middle">Partners join</text><text x="312" y="202" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">Nearby people find it in</text><text x="312" y="221" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">the feed or on the map;</text><text x="312" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">the host accepts.</text><path d="M356 114 H460" fill="none" stroke="#5b8cff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hb)"/><rect x="474" y="84" width="60" height="60" rx="14" fill="#1f2227" stroke="#3a3f47" stroke-width="1"/><g transform="translate(504 114)"><path d="M-14 -10 a6 6 0 0 1 6 -6 H8 a6 6 0 0 1 6 6 V2 a6 6 0 0 1 -6 6 H-4 L-11 15 V8 a6 6 0 0 1 -3 -6 Z" fill="none" stroke="#5b8cff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-5" cy="-4" r="1.3" fill="#5b8cff"/><circle cx="0" cy="-4" r="1.3" fill="#5b8cff"/><circle cx="5" cy="-4" r="1.3" fill="#5b8cff"/></g><text letter-spacing="1.5" x="504" y="76" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#5b8cff" text-anchor="middle">03</text><text x="504" y="178" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="650" fill="#e8e6df" text-anchor="middle">Group chat</text><text x="504" y="202" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">Everyone coordinates in</text><text x="504" y="221" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">one shared chat room.</text><path d="M548 114 H652" fill="none" stroke="#5b8cff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hb)"/><rect x="666" y="84" width="60" height="60" rx="14" fill="#1f2227" stroke="#3a3f47" stroke-width="1"/><g transform="translate(696 114)"><rect x="-14" y="-14" width="10" height="10" rx="2" fill="none" stroke="#5b8cff" stroke-width="1.7"/><rect x="4" y="-14" width="10" height="10" rx="2" fill="none" stroke="#5b8cff" stroke-width="1.7"/><rect x="-14" y="4" width="10" height="10" rx="2" fill="none" stroke="#5b8cff" stroke-width="1.7"/><rect x="-11" y="-11" width="4" height="4" fill="#5b8cff"/><rect x="7" y="-11" width="4" height="4" fill="#5b8cff"/><rect x="-11" y="7" width="4" height="4" fill="#5b8cff"/><path d="M4 4 h4 v4 M14 4 v2 M8 14 h6 M14 10 v4" fill="none" stroke="#5b8cff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><text letter-spacing="1.5" x="696" y="76" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#5b8cff" text-anchor="middle">04</text><text x="696" y="178" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="650" fill="#e8e6df" text-anchor="middle">QR check-in</text><text x="696" y="202" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">The host shows a QR code;</text><text x="696" y="221" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">partners scan it at</text><text x="696" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">the meet-up.</text><path d="M740 114 H844" fill="none" stroke="#5b8cff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hb)"/><rect x="858" y="84" width="60" height="60" rx="14" fill="#1f2227" stroke="#3a3f47" stroke-width="1"/><g transform="translate(888 114)"><path d="M0 -15 L4.4 -5 L15 -4 L7 3.2 L9.4 14 L0 8.4 L-9.4 14 L-7 3.2 L-15 -4 L-4.4 -5 Z" fill="none" stroke="#5b8cff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><text letter-spacing="1.5" x="888" y="76" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#5b8cff" text-anchor="middle">05</text><text x="888" y="178" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="650" fill="#e8e6df" text-anchor="middle">Rate each other</text><text x="888" y="202" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">1 to 5 stars from every</text><text x="888" y="221" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">participant after the</text><text x="888" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">deal.</text><path d="M932 114 H1036" fill="none" stroke="#5b8cff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hb)"/><rect x="1050" y="84" width="60" height="60" rx="14" fill="#1f2227" stroke="#3a3f47" stroke-width="1"/><g transform="translate(1080 114)"><path d="M0 -15 L12 -10 V1 C12 8 7 13 0 16 C-7 13 -12 8 -12 1 V-10 Z" fill="none" stroke="#5b8cff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M-5 3 L0 -3 L5 3 M0 -3 V8" fill="none" stroke="#5b8cff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><text letter-spacing="1.5" x="1080" y="76" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#5b8cff" text-anchor="middle">06</text><text x="1080" y="178" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="650" fill="#e8e6df" text-anchor="middle">Score updates</text><text x="1080" y="202" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">Cloud Functions adjust the</text><text x="1080" y="221" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">credibility score and tier:</text><text x="1080" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a9b1" text-anchor="middle">User, Trusted, Elite.</text>
</svg>
